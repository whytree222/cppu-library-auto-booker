name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify booking confirmation flow
        run: |
          npm ci --ignore-scripts
          npm test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare verified offline OCR model
        run: python scripts/prepare_ocr.py
      - name: Verify offline model contract (synthetic input only)
        run: |
          python -m pip install 'onnxruntime==1.24.3'
          python scripts/verify_ocr_model.py
      - name: Install Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' | sort -V | tail -1)
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build installable APK
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - name: Preserve Android test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/test-results/testDebugUnitTest
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: library-auto-booker-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.13.11 >/dev/null 2>&1; then
            gh release upload v0.13.11 app/build/outputs/apk/debug/app-debug.apk --clobber
          else
            gh release create v0.13.11 app/build/outputs/apk/debug/app-debug.apk --title '图书馆自动预约 v0.13.11 · 未触发登录时整页恢复' --notes '不再仅重按旧页面登录按钮。未观察到点击/提交时先检查学校会话，再原子核对并封闭尚未提交的旧表单，1.5秒后从图书馆代理登录入口重新加载，自动填入账号、识别新验证码并登录。与明确验证码拒绝共享两次重新开始、三次触控和90秒上限，不新建Driver重置预算。登录检查的具体原因保留显示，不再统一归因校园网；网络故障不自动重发。已观察到点击/提交、结果未知、手动接管、学校拒绝或配置改变时不盲目重新开始。仅调整登录流程，不重复提交座位预约。不使用真实学校账号测试，首次自动跳转仍需手机验证。'
          fi

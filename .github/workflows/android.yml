name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify booking confirmation flow
        run: |
          npm ci --ignore-scripts
          npm test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare verified offline OCR model
        run: python scripts/prepare_ocr.py
      - name: Verify offline model contract (synthetic input only)
        run: |
          python -m pip install 'onnxruntime==1.24.3'
          python scripts/verify_ocr_model.py
      - name: Install Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' | sort -V | tail -1)
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build installable APK
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - name: Preserve Android test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/test-results/testDebugUnitTest
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: library-auto-booker-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.13.4 >/dev/null 2>&1; then
            gh release upload v0.13.4 app/build/outputs/apk/debug/app-debug.apk --clobber
          else
            gh release create v0.13.4 app/build/outputs/apk/debug/app-debug.apk --title '图书馆自动预约 v0.13.4 · 进入网页自动接续登录' --notes '修复首次进入或返回前台时将提前出现的网址当作已加载文档的问题，等待真实网页完成回调后自动接续统一认证和图书馆登录。重复页面完成回调不再重新准备账号或误判尚在等待结果的登录。初次进入、主动重启和后台恢复使用相同启动入口，无需将重新开始按钮作为正常登录步骤。保留两套独立加密账号、当前验证码校验、五天选项、手动优先、单次提交及未知结果暂停保护，不擅自重新启用已暂停账号，继续允许截屏。新增无需点击重启的两步流程及加载时序模拟回归；未使用真实账号提交学校认证，仍需手机复测。'
          fi

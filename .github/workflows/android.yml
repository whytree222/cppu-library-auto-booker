name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify booking confirmation flow
        run: |
          npm ci --ignore-scripts
          npm test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare verified offline OCR model
        run: python scripts/prepare_ocr.py
      - name: Verify offline model contract (synthetic input only)
        run: |
          python -m pip install 'onnxruntime==1.24.3'
          python scripts/verify_ocr_model.py
      - name: Install Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' | sort -V | tail -1)
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build installable APK
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - name: Preserve Android test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/test-results/testDebugUnitTest
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: library-auto-booker-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.12.1 >/dev/null 2>&1; then
            gh release upload v0.12.1 app/build/outputs/apk/debug/app-debug.apk --clobber
          else
            gh release create v0.12.1 app/build/outputs/apk/debug/app-debug.apk --title '图书馆自动预约 v0.12.1 · WebVPN 验证码自动填写' --notes '适配学校统一认证真实页面，在 WebVPN 登录前台自动读取当前已加载的验证码，用本机 ddddocr 识别并填写；不再需要截图导入。默认启用，可关闭或主动重新识别。保护手动输入、页面跳转及图片变化后的旧结果，识别失败停止；不上传图片，不请求新验证码，不保存统一认证账号密码，不自动点击登录。账号密码和登录按钮仍由用户在学校页面操作；后台统一认证无人值守重登尚未实现。原有预约及安全备用切换规则不变。'
          fi

name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify booking confirmation flow
        run: |
          npm ci --ignore-scripts
          npm test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare verified offline OCR model
        run: python scripts/prepare_ocr.py
      - name: Verify offline model contract (synthetic input only)
        run: |
          python -m pip install 'onnxruntime==1.24.3'
          python scripts/verify_ocr_model.py
      - name: Install Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' | sort -V | tail -1)
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build installable APK
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - name: Preserve Android test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/test-results/testDebugUnitTest
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: library-auto-booker-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.13.0 >/dev/null 2>&1; then
            gh release upload v0.13.0 app/build/outputs/apk/debug/app-debug.apk --clobber
          else
            gh release create v0.13.0 app/build/outputs/apk/debug/app-debug.apk --title '图书馆自动预约 v0.13.0 · WebVPN 两步自动登录' --notes '新增独立的统一认证、WebVPN 内图书馆两套账号设置；用户明确开启后分别本机加密保存。修复验证码原始地址和代理地址混用时的定位，使用本机 ddddocr 读取当前图片并通过学校原登录按钮提交，保留学校密码加密流程；认证后再用第二套账号登录图书馆。两层分别校验，不以已填验证码当作成功；失败或提交结果不明停止并暂停对应账号，避免连续登录。登录页顶部精简并避让系统状态栏。仅在提交预约前按既有直连网络故障规则使用 WebVPN，业务拒绝不切换，提交后不明不重发。请先在前台设置两套账号并实测；未使用真实账号代测，不保证验证码准确率或手机整夜后台运行。'
          fi

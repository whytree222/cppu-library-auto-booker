name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify booking confirmation flow
        run: |
          npm ci --ignore-scripts
          npm test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare verified offline OCR model
        run: python scripts/prepare_ocr.py
      - name: Verify offline model contract (synthetic input only)
        run: |
          python -m pip install 'onnxruntime==1.24.3'
          python scripts/verify_ocr_model.py
      - name: Install Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' | sort -V | tail -1)
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build installable APK
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - name: Preserve Android test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/test-results/testDebugUnitTest
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: library-auto-booker-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.13.8 >/dev/null 2>&1; then
            gh release upload v0.13.8 app/build/outputs/apk/debug/app-debug.apk --clobber
          else
            gh release create v0.13.8 app/build/outputs/apk/debug/app-debug.apk --title '图书馆自动预约 v0.13.8 · 会话隔离与验证码失效自动重启' --notes '阻止过时探测写回旧 Cookie/状态，离开页面取消恢复订阅；前台 WebVPN 登录与隐藏登录互斥，防止验证码会话争用。仅在提交后新文档明确返回验证码无效/错误/过期时，间隔至少 1.5 秒自动从登录入口重新开始，最多两次，仍遵守同一 90 秒总上限。用户操作优先，账号密码错误、锁定、限流、额外验证、混合错误或未知提交结果不重发；验证码失败不冒充密码错误，不擅自解除已暂停账号。模拟网页与原生回归通过后构建，没有使用真实账号代登录；需手机复测首次自动进入以及图书馆第二层登录。'
          fi

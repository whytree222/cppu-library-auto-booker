name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify booking confirmation flow
        run: |
          npm ci --ignore-scripts
          npm test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare verified offline OCR model
        run: python scripts/prepare_ocr.py
      - name: Verify offline model contract (synthetic input only)
        run: |
          python -m pip install 'onnxruntime==1.24.3'
          python scripts/verify_ocr_model.py
      - name: Install Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' | sort -V | tail -1)
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build installable APK
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - name: Preserve Android test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/test-results/testDebugUnitTest
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: library-auto-booker-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.13.9 >/dev/null 2>&1; then
            gh release upload v0.13.9 app/build/outputs/apk/debug/app-debug.apk --clobber
          else
            gh release create v0.13.9 app/build/outputs/apk/debug/app-debug.apk --title '图书馆自动预约 v0.13.9 · 原登录按钮应用内触控' --notes '实际 WebVPN 会包装原登录按钮的点击处理。本版首次提交改为核验原表单、已填写账号和当前验证码后，在本应用 WebView 内发送一次按下/抬起，保留校方及代理原点击校验、RSA 与提交；不预先执行旧表单提交再补点。坐标、遮挡、缩放、布局、页面、账号及生命周期有变化时停止或取消输入；触摸结果不明绝不改走其它方式重发。不使用系统输入、无障碍或伪造窗口焦点。保留会话隔离、12 秒只读结果检查、90 秒总上限和明确验证码失效最多两次新页面重启。新增代理按钮包装模拟与原生输入回归，没有真实账号代登录；需手机分别复测首次自动跳转和后台恢复。'
          fi

name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify booking confirmation flow
        run: |
          npm ci --ignore-scripts
          npm test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' | sort -V | tail -1)
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build installable APK
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - name: Preserve Android test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/test-results/testDebugUnitTest
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: library-auto-booker-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum app/build/outputs/apk/debug/app-debug.apk
          if gh release view v0.17.3 >/dev/null 2>&1; then
            gh release upload v0.17.3 app/build/outputs/apk/debug/app-debug.apk --clobber
          else
            gh release create v0.17.3 app/build/outputs/apk/debug/app-debug.apk --title '图书馆自动预约 v0.17.3 · 本地房间时段' --notes '弃用进入预约页、切换房间或日期时的自动在线同步。直接读取各房间独立的本地时间表，不因同步登录过期而阻碍选时段；仅点击手动更新时联网。写入已核对的报刊阅览区第二、六段秒数，保留其他房间自身规则。实际预约仍恢复登录并精确核验房间、日期、时段、座位；未知结果停止，不盲目重发。保留直接预约和下次00:58一次性预约。'
          fi

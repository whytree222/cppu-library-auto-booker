name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify booking confirmation flow
        run: |
          npm ci --ignore-scripts
          npm test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare verified offline OCR model
        run: python scripts/prepare_ocr.py
      - name: Verify offline model contract (synthetic input only)
        run: |
          python -m pip install 'onnxruntime==1.24.3'
          python scripts/verify_ocr_model.py
      - name: Install Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' | sort -V | tail -1)
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build installable APK
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - name: Preserve Android test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/test-results/testDebugUnitTest
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: library-auto-booker-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.14.0 >/dev/null 2>&1; then
            gh release upload v0.14.0 app/build/outputs/apk/debug/app-debug.apk --clobber
          else
            gh release create v0.14.0 app/build/outputs/apk/debug/app-debug.apk --title '图书馆自动预约 v0.14.0 · 多楼层全阅览室通用预约' --notes '新增从学校同步全部楼层阅览室，按实际房间编号、名称与时间模式建档，不再只预约过刊。固定时段按房间选择；自选时间房间填写起止时间，通过学校原按钮进入座位图。其他房间按完整编号在当前地图唯一匹配，不套用G编号目录。演练和提交均核对房间、日期、时间；切换房间清空旧座位时段并取消旧闹钟，已入队闹钟绑定目标指纹避免误用新设置。保留直连/WebVPN、等待放号和结果未知不重发；追加后三段仅限已核对的过刊七段。学校未提供完整规则或页面不兼容时明确停止，不猜测。保留v0.13.12登录修复。本轮使用模拟数据测试，未代用户真实登录或预约，全馆实际页面需逐房间演练验证。'
          fi

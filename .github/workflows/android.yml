name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify booking confirmation flow
        run: |
          npm ci --ignore-scripts
          npm test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare verified offline OCR model
        run: python scripts/prepare_ocr.py
      - name: Verify offline model contract (synthetic input only)
        run: |
          python -m pip install 'onnxruntime==1.24.3'
          python scripts/verify_ocr_model.py
      - name: Install Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' | sort -V | tail -1)
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build installable APK
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - name: Preserve Android test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/test-results/testDebugUnitTest
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: library-auto-booker-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.13.2 >/dev/null 2>&1; then
            gh release upload v0.13.2 app/build/outputs/apk/debug/app-debug.apk --clobber
          else
            gh release create v0.13.2 app/build/outputs/apk/debug/app-debug.apk --title '图书馆自动预约 v0.13.2 · 修复统一认证相对路径' --notes '校方公开统一认证表单使用 /tpass/login，验证码使用 /tpass/captcha.jpg；WebVPN 可保留这些原始根相对属性。修复旧版按门户地址解析而误报目标不匹配的问题：兼容学校原始属性与代理属性，必要时在填写凭据前将已验证的原始表单目标转成同一学校代理路径，保留查询参数；仍检查实际提交地址与已加载图片，不额外刷新验证码、不允许其他主机。细分原始地址、实际地址及转换失败原因。两步账号独立保存、提交后不明停止等保护不变，继续允许截屏。模拟回归与构建通过不等于真实账号实测，安装后请重新打开 WebVPN 登录页验证。'
          fi

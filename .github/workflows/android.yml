name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify booking confirmation flow
        run: |
          npm ci --ignore-scripts
          npm test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare verified offline OCR model
        run: python scripts/prepare_ocr.py
      - name: Verify offline model contract (synthetic input only)
        run: |
          python -m pip install 'onnxruntime==1.24.3'
          python scripts/verify_ocr_model.py
      - name: Install Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' | sort -V | tail -1)
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build installable APK
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - name: Preserve Android test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/test-results/testDebugUnitTest
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: library-auto-booker-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.16.0 >/dev/null 2>&1; then
            gh release upload v0.16.0 app/build/outputs/apk/debug/app-debug.apk --clobber
          else
            gh release create v0.16.0 app/build/outputs/apk/debug/app-debug.apk --title '图书馆自动预约 v0.16.0 · 预约、权限、记录独立页面' --notes '底部导航分为预约、权限、记录三个页面。预约页集中楼层阅览室、交互座位图、放号时间及使用日期时段；权限页集中精确闹钟、通知、省电和自启动检查，以及60秒后台唤醒测试；记录页独立展示最近三次任务，支持展开步骤。切换页面保留预约草稿、各页滚动位置及可保存的展开状态，不触发预约或修改已安排任务；从权限设置返回后刷新授权状态，首次权限引导保留。当前源码及上一发布版未发现WebDAV功能或依赖，未误删WebVPN校外访问。沿用原有登录、真实座位图、定时及防重复提交流程。使用离线和模拟测试验证，未在学校系统提交真实预约。'
          fi

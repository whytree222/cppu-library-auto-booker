name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify booking confirmation flow
        run: |
          npm ci --ignore-scripts
          npm test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' | sort -V | tail -1)
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build installable APK
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - name: Preserve Android test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/test-results/testDebugUnitTest
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: library-auto-booker-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum app/build/outputs/apk/debug/app-debug.apk
          if gh release view v0.17.5 >/dev/null 2>&1; then
            gh release upload v0.17.5 app/build/outputs/apk/debug/app-debug.apk --clobber
          else
            gh release create v0.17.5 app/build/outputs/apk/debug/app-debug.apk --title '图书馆自动预约 v0.17.5 · 直接预约结果弹窗' --notes '直接预约的最终反馈以应用内弹窗显示，保留学校原因和房间座位信息，长内容可滚动。通过本次请求编号关联结果，不弹旧任务或定时任务，不把选座/提交/追加中的进度当作成功。参数错误和启动失败也弹窗说明；超时、服务中断或结果不明提示核对学校记录。关闭弹窗不会重新预约，详细步骤继续保留记录页。保留本地各房间时间表，不恢复自动同步。离线与Android单元/界面测试验证，未提交真实预约。'
          fi

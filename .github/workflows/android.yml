name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify booking confirmation flow
        run: |
          npm ci --ignore-scripts
          npm test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare verified offline OCR model
        run: python scripts/prepare_ocr.py
      - name: Verify offline model contract (synthetic input only)
        run: |
          python -m pip install 'onnxruntime==1.24.3'
          python scripts/verify_ocr_model.py
      - name: Install Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' | sort -V | tail -1)
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build installable APK
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - name: Preserve Android test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/test-results/testDebugUnitTest
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: library-auto-booker-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.15.0 >/dev/null 2>&1; then
            gh release upload v0.15.0 app/build/outputs/apk/debug/app-debug.apk --clobber
          else
            gh release create v0.15.0 app/build/outputs/apk/debug/app-debug.apk --title '图书馆自动预约 v0.15.0 · 按楼层交互座位图选座' --notes '内置从学校正常页面采集的一至四楼7间阅览室真实座位布局，共962个标记。按楼层选择房间，点击座位加入或移除候选，支持候选前移、清空和双向滑动；取代手输座位号。重复、异常和3个无编号标记禁选，不虚构编号。保留原始大小写（包括K043c），所选座位行列坐标随任务保存，运行时复核学校实际布局，位置变化则停止。点击地图只修改草稿，选好日期时段后显式立即预约或保存定时计划；默认演练不提交。图不表示实时空闲，仍以学校当前页面及返回结果为准。切换房间清空旧选座和定时任务；追加后三段保留同座位坐标。保留直连/WebVPN及现有登录流程。测试使用离线采集布局和模拟提交，未创建真实预约；学校规则变化时需同步后先演练。'
          fi


name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify booking confirmation flow
        run: |
          npm ci --ignore-scripts
          npm test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' | sort -V | tail -1)
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build installable APK
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - name: Preserve Android test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/test-results/testDebugUnitTest
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: library-auto-booker-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum app/build/outputs/apk/debug/app-debug.apk
          if gh release view v0.17.0 >/dev/null 2>&1; then
            gh release upload v0.17.0 app/build/outputs/apk/debug/app-debug.apk --clobber
          else
            gh release create v0.17.0 app/build/outputs/apk/debug/app-debug.apk --title '图书馆自动预约 v0.17.0 · 校园网直连与一键预约' --notes '移除WebVPN校外代理、网址转换、统一认证、两套账号设置及对应验证码OCR依赖。仅保留校园网直连和图书馆自动重新登录。移除自定义/多个抢座时间、演练和立即提交入口，选好座位与使用日期时段后，点击一个预约按钮安排下一次手机本地00:58的一次性真实预约，明确未开放时最多等待10分钟，不每日循环。保留取消计划、停止当前任务，网络或账号错误及提交结果不明停止，避免重复预约。升级取消旧自定义时间任务并清除退役WebVPN保存信息，保留直连账号和选座使用时段，需用户重新点击预约。沿用独立预约、权限、记录三页及真实楼层座位图。离线模拟和Android测试验证，未连接学校创建真实预约。'
          fi

name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify booking confirmation flow
        run: |
          npm ci --ignore-scripts
          npm test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' | sort -V | tail -1)
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build installable APK
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: library-auto-booker-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.6.1 >/dev/null 2>&1; then
            gh release upload v0.6.1 app/build/outputs/apk/debug/app-debug.apk --clobber
          else
            gh release create v0.6.1 app/build/outputs/apk/debug/app-debug.apk --title '图书馆自动预约 v0.6.1' --notes '修复今天时段日期校验：支持完整日期和相对使用日，排除隐藏的旧时段选项，下一步按钮限定于当前时段表单。增加今天/明天及日期不匹配回归测试。'
          fi

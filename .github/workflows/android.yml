name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify booking confirmation flow
        run: |
          npm ci --ignore-scripts
          npm test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare verified offline OCR model
        run: python scripts/prepare_ocr.py
      - name: Verify offline model contract (synthetic input only)
        run: |
          python -m pip install 'onnxruntime==1.24.3'
          python scripts/verify_ocr_model.py
      - name: Install Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' | sort -V | tail -1)
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build installable APK
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - name: Preserve Android test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/test-results/testDebugUnitTest
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: library-auto-booker-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.13.10 >/dev/null 2>&1; then
            gh release upload v0.13.10 app/build/outputs/apk/debug/app-debug.apk --clobber
          else
            gh release create v0.13.10 app/build/outputs/apk/debug/app-debug.apk --title '图书馆自动预约 v0.13.10 · 登录按钮有界自动重试' --notes '触摸调用返回 false 不再直接停止，先核对网页按钮事件及学校登录状态。未观察到点击/提交、当前账号与验证码仍有效且学校明确仍要求认证时，间隔至少 1.5 秒再次尝试原登录按钮，整轮最多三次，仍共享原 90 秒上限。已有点击、提交或跳转时不盲目连点；成功后接续图书馆登录，验证码失效改用新页面。手动操作、账号改变、密码错误、限制、额外验证、未知网络结果停止。仅调整统一认证登录，不重复提交座位预约。新增网页与原生模拟回归，没有使用真实账号代登录，需手机复测。'
          fi

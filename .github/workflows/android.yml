name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify booking confirmation flow
        run: |
          npm ci --ignore-scripts
          npm test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' | sort -V | tail -1)
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build installable APK
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - name: Preserve Android test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/test-results/testDebugUnitTest
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: library-auto-booker-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum app/build/outputs/apk/debug/app-debug.apk
          if gh release view v0.17.4 >/dev/null 2>&1; then
            gh release upload v0.17.4 app/build/outputs/apk/debug/app-debug.apk --clobber
          else
            gh release create v0.17.4 app/build/outputs/apk/debug/app-debug.apk --title '图书馆自动预约 v0.17.4 · 全楼层本地时段核对' --notes '补齐另外六间阅览室的实际时段核对，使用日2026-10-24：科技第二段10:01:10开始；社科二区第一段10:00:01结束、第四段14:31:00开始；理科第一段10:00:01结束；文科第六段19:29:00结束。社科一区、过刊与旧记录一致。本地七间房分别保存时段和核对日期，保留原座位布局。继续本地优先，切换房间/日期不自动联网；预约时仍验证真实房间、日期、时段、座位与登录。仅正常查看网页取得时段，没有创建真实预约。'
          fi

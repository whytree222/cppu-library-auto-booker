name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify booking confirmation flow
        run: |
          npm ci --ignore-scripts
          npm test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' | sort -V | tail -1)
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build installable APK
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - name: Preserve Android test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/test-results/testDebugUnitTest
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: library-auto-booker-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum app/build/outputs/apk/debug/app-debug.apk
          if gh release view v0.17.2 >/dev/null 2>&1; then
            gh release upload v0.17.2 app/build/outputs/apk/debug/app-debug.apk --clobber
          else
            gh release create v0.17.2 app/build/outputs/apk/debug/app-debug.apk --title '图书馆自动预约 v0.17.2 · 按房间和使用日更新时段' --notes '切换房间或今天/明天时自动读取对应时段，不再混合两天或套用一楼时间。显示核对日期与缓存状态，读取失败不伪报成功；仅读取当前房间，45秒上限，退出即停止。保留同一房间的座位，已选时间仅按完整起止时间保留，变化时提示重选；实际规则更新取消旧等待计划，日期元数据更新不覆盖独立计划。修复未选时段合法秒数变化导致整组停止的问题，所选时间变化、错误房间/日期、签名不完整、重复重叠和隐藏额外勾选仍停止。不按序号或分钟猜测替换时间；运行时仍精确核验。保留直接预约、下次00:58一次性计划、最多等待开放10分钟及未知提交结果停止规则。仍仅校园网直连，不恢复WebVPN或OCR。使用离线模拟、Android单元和界面测试验证，未在学校系统创建真实预约。'
          fi

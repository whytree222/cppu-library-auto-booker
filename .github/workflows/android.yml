name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify booking confirmation flow
        run: |
          npm ci --ignore-scripts
          npm test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare verified offline OCR model
        run: python scripts/prepare_ocr.py
      - name: Verify offline model contract (synthetic input only)
        run: |
          python -m pip install 'onnxruntime==1.24.3'
          python scripts/verify_ocr_model.py
      - name: Install Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' | sort -V | tail -1)
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build installable APK
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - name: Preserve Android test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/test-results/testDebugUnitTest
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: library-auto-booker-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.13.6 >/dev/null 2>&1; then
            gh release upload v0.13.6 app/build/outputs/apk/debug/app-debug.apk --clobber
          else
            gh release create v0.13.6 app/build/outputs/apk/debug/app-debug.apk --title '图书馆自动预约 v0.13.6 · 登录过期恢复与验证码自动重试' --notes '修复主页及入口页状态检查只显示过期却不接续两步登录的问题；已启用账号可恢复，状态卡显示阶段或无法恢复的原因。备用会话维护不覆盖直连状态或首选通道，预约运行中状态卡不另起认证。验证码临时读取失败自动再读两次，识别不可靠时通过校方原图按钮最多换两张图，保留三图、原始输出一致及置信门槛；旧图不更新八秒则停止。统一认证提交后停止刷新，未知结果不重发，关闭、暂停和手动输入优先。失败状态检查五分钟冷却后可再自动检查，不擅自解除账号安全暂停，不限制预约任务原有恢复入口。新增网页与原生模拟回归；未使用真实账号登录学校，需手机复测。'
          fi

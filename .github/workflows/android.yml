name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify booking confirmation flow
        run: |
          npm ci --ignore-scripts
          npm test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' | sort -V | tail -1)
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build installable APK
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - name: Preserve Android test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/test-results/testDebugUnitTest
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: library-auto-booker-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum app/build/outputs/apk/debug/app-debug.apk
          if gh release view v0.17.1 >/dev/null 2>&1; then
            gh release upload v0.17.1 app/build/outputs/apk/debug/app-debug.apk --clobber
          else
            gh release create v0.17.1 app/build/outputs/apk/debug/app-debug.apk --title '图书馆自动预约 v0.17.1 · 恢复直接预约' --notes '恢复直接预约按钮，与下次00:58定时预约并列。直接预约立即按当前日期和所选房间、座位、使用时段尝试真实预约，不等00:58，也不等待尚未开放；无需精确闹钟权限。定时入口仍为下一次00:58启动、明确未开放时最多等待10分钟的一次性计划。两个入口分别显示预计使用日期。直接预约通过不可变目标快照交给后台，不覆盖已有定时计划及其选座时段；任务运行中拒绝并发重复启动。保留精确座位图复核、同座位追加、学校确认与未知结果停止规则。仍仅校园网直连，不恢复WebVPN或OCR。离线模拟与Android单元/界面测试验证，未在学校系统创建真实预约。'
          fi

name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify booking confirmation flow
        run: |
          npm ci --ignore-scripts
          npm test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare verified offline OCR model
        run: python scripts/prepare_ocr.py
      - name: Verify offline model contract (synthetic input only)
        run: |
          python -m pip install 'onnxruntime==1.24.3'
          python scripts/verify_ocr_model.py
      - name: Install Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' | sort -V | tail -1)
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build installable APK
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - name: Preserve Android test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/test-results/testDebugUnitTest
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: library-auto-booker-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.13.7 >/dev/null 2>&1; then
            gh release upload v0.13.7 app/build/outputs/apk/debug/app-debug.apk --clobber
          else
            gh release create v0.13.7 app/build/outputs/apk/debug/app-debug.apk --title '图书馆自动预约 v0.13.7 · 统一认证表单提交适配' --notes '对学校已核对的密码登录按钮结构，保留原 checkPassLogin 校验和 RSA 加密后采用标准 requestSubmit 原按钮，保留浏览器约束及 submit 事件，不使用绕过校验的 form.submit，不在不明结果后补点或重发。调用前启动结果观察，修复脚本回调丢失时停在调用前提示的问题；只读确认学校会话通过后自动接续图书馆登录。细分脚本等待、本地校验、表单事件和未知结果；加密脚本未加载仅在确定未提交时等待继续，旧计时器不误判新调用。新添网页及原生模拟回归，没有用真实账号代登录，仍需手机复测；不擅自解除已暂停账号。'
          fi

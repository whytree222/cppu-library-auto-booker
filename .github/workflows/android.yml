name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify booking confirmation flow
        run: |
          npm ci --ignore-scripts
          npm test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' | sort -V | tail -1)
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build installable APK
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: library-auto-booker-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.7.1 >/dev/null 2>&1; then
            gh release upload v0.7.1 app/build/outputs/apk/debug/app-debug.apk --clobber
          else
            gh release create v0.7.1 app/build/outputs/apk/debug/app-debug.apk --title '图书馆自动预约 v0.7.1' --notes '根据完整HTML适配过刊阅览室94个位置：G001–G023的A/B/C/D及YXS1、YXS2。修复右侧座位编号末尾换行导致的定位和提交失败；仅精确匹配座位图元素，校验编号唯一及显示文字一致。逐座位模拟选中、确认和提交测试通过。'
          fi


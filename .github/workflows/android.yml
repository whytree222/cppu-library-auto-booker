name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify booking confirmation flow
        run: |
          npm ci --ignore-scripts
          npm test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare verified offline OCR model
        run: python scripts/prepare_ocr.py
      - name: Verify offline model contract (synthetic input only)
        run: |
          python -m pip install 'onnxruntime==1.24.3'
          python scripts/verify_ocr_model.py
      - name: Install Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' | sort -V | tail -1)
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build installable APK
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - name: Preserve Android test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/test-results/testDebugUnitTest
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: library-auto-booker-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.13.5 >/dev/null 2>&1; then
            gh release upload v0.13.5 app/build/outputs/apk/debug/app-debug.apk --clobber
          else
            gh release create v0.13.5 app/build/outputs/apk/debug/app-debug.apk --title '图书馆自动预约 v0.13.5 · 修复未开放等待误判' --notes '修复学校提示“当前时间为:… 未到可预约时间!”因漏匹配可字而立即停止等待的问题，开放检查、时段选择及明确预约结果三处同步适配。开启等待后继续在服务实际启动的十分钟窗口内串行检查，开放后进入原选座流程，拒绝和返回检查不会重置窗口。未开启等待、登录失效、已有预约、次数限制、网络异常及未知提交结果等仍按原保护停止，不以业务拒绝切换通道，不盲目重发结果不明的预约。新增截图原文的五分钟后开放、十分钟截止、剩余窗口、时段及确认结果和混合拒绝模拟回归；未向学校真实提交预约，仍需手机复测。'
          fi

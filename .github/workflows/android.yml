name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify booking confirmation flow
        run: |
          npm ci --ignore-scripts
          npm test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare verified offline OCR model
        run: python scripts/prepare_ocr.py
      - name: Verify offline model contract (synthetic input only)
        run: |
          python -m pip install 'onnxruntime==1.24.3'
          python scripts/verify_ocr_model.py
      - name: Install Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' | sort -V | tail -1)
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build installable APK
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - name: Preserve Android test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/test-results/testDebugUnitTest
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: library-auto-booker-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.13.12 >/dev/null 2>&1; then
            gh release upload v0.13.12 app/build/outputs/apk/debug/app-debug.apk --clobber
          else
            gh release create v0.13.12 app/build/outputs/apk/debug/app-debug.apk --title '图书馆自动预约 v0.13.12 · 触控无效时原位重试与学校处理器兜底' --notes '修复两个只影响统一认证登录的具体缺陷。一、验证码有界换图恢复此前失效：自动填写成功后，换图前会把应用自己写入的值误判为手动输入并停止整轮登录，现在只阻止真正的手动内容，应用自己的四位验证码不再阻止换图。二、触控没有产生任何网页事件时不再直接失败或只整页重载：仅在只读核对学校仍要求登录、且网页能证明零点击零提交时，先在原页面重新定位并再发送一次应用内触控（点位置偏或控件遮挡属此类，重新定位会重新测量遮挡），仍无事件则改用学校自己的内联校验处理器（保留原 onclick，WebVPN 改写后的 vpn_rewrite_js 包装形式则通过原按钮自身点击）加标准表单提交，校验与密码加密仍由学校完成，不重新实现学校登录。两步每轮各最多一次，观察到点击/提交、手动接管、字段或验证码变化、原按钮非学校处理器、学校本地校验拒绝时均不使用；仍在原 90 秒期限和共享触控次数上限内，只有明确未提交才封闭旧表单并整页重新开始。校方返回登录页但无可确认原因时，不再空等 12 秒只读核验超时，改走同一条只读核对与有界恢复路径。不重复提交座位预约，不使用真实学校账号测试。'
          fi

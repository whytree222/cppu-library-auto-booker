name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify booking confirmation flow
        run: |
          npm ci --ignore-scripts
          npm test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' | sort -V | tail -1)
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build installable APK
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - name: Preserve Android test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/test-results/testDebugUnitTest
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: library-auto-booker-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum app/build/outputs/apk/debug/app-debug.apk
          if gh release view v0.18.0 >/dev/null 2>&1; then
            gh release upload v0.18.0 app/build/outputs/apk/debug/app-debug.apk --clobber
          else
            gh release create v0.18.0 app/build/outputs/apk/debug/app-debug.apk --title '图书馆自动预约 v0.18.0 · Material 3 界面改版' --notes '预约页按任务摘要、登录与准备、房间座位、日期时段和操作区重新组织，任务状态和下次启动时间只显示一次。房间座位、日期时段、直接与定时预约、权限页、记录页和底部导航统一为 Material 3 组件，新增独立深色配色与系统字体缩放适配；运行中只显示可用的停止或取消操作。仅调整前端界面，预约、调度、登录和本地存储逻辑未变。Node 与 Android 测试通过，未提交真实预约。'
          fi

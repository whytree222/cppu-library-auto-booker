name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify booking confirmation flow
        run: |
          npm ci --ignore-scripts
          npm test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare verified offline OCR model
        run: python scripts/prepare_ocr.py
      - name: Verify offline model contract (synthetic input only)
        run: |
          python -m pip install 'onnxruntime==1.24.3'
          python scripts/verify_ocr_model.py
      - name: Install Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' | sort -V | tail -1)
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build installable APK
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - name: Preserve Android test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/test-results/testDebugUnitTest
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: library-auto-booker-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.13.3 >/dev/null 2>&1; then
            gh release upload v0.13.3 app/build/outputs/apk/debug/app-debug.apk --clobber
          else
            gh release create v0.13.3 app/build/outputs/apk/debug/app-debug.apk --title '图书馆自动预约 v0.13.3 · 两步登录衔接与五天选项' --notes '修复图书馆页的主表单与页头登录框同名导致误判，凭据只填入主表单。兼容代理下主表单原始相对地址；保留提交函数的密码编码、目标校验、手动输入优先和单次提交保护。统一认证与验证码绑定使用等价原始/代理地址，避免正常改写被当成用户修改；验证码先于账号准备完成时也能在准备后提交一次。新增自动勾选校方五天内自动登录选项，默认开启，在更多操作中可关闭，支持移动/桌面重复选项且不覆盖手动修改，实际有效期由校方决定。细化当前阶段和图书馆失败原因，继续允许截屏。未使用真实账号提交学校认证，需手机前台复测；验证码未能安全识别时不会自动登录。'
          fi
